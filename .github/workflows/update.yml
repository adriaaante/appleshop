# Каждые 30 минут: забрать посты канала → собрать каталог и сайт → сохранить данные в main → выложить сайт.
name: Обновление каталога
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['src/**', 'scripts/**', 'site.config.json', 'package*.json']
concurrency: { group: update, cancel-in-progress: false }
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Посты канала
        run: npm run fetch
        env:
          APPLESHOP_TELEGRAM_BOT_TOKEN: ${{ secrets.APPLESHOP_TELEGRAM_BOT_TOKEN }}
      - run: npm run build
      - name: Сохранить посты и историю цен
        run: |
          git config user.name 'appleshop-bot'
          git config user.email 'appleshop-bot@users.noreply.github.com'
          git add data/
          git diff --cached --quiet || { git commit -m "Каталог: обновление цен $(date -u +%Y-%m-%dT%H:%MZ)" && git push; }
      - uses: actions/upload-pages-artifact@v3
        if: vars.APPLESHOP_PAGES == 'true'
        with: { path: dist }
  deploy:
    needs: build
    if: vars.APPLESHOP_PAGES == 'true'
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
