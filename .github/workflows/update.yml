# Каждые 30 минут: забрать посты канала → собрать каталог и сайт → сохранить данные в main → выложить тестовую копию в ветку gh-pages.
name: Обновление каталога
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    paths: ['src/**', 'scripts/**', 'site.config.json', 'package*.json']
concurrency: { group: update, cancel-in-progress: false }
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Данные (посты, история цен) всегда живут в main — и при запуске по расписанию с ветки по умолчанию.
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Посты канала
        run: npm run fetch
        env:
          APPLESHOP_TELEGRAM_BOT_TOKEN: ${{ secrets.APPLESHOP_TELEGRAM_BOT_TOKEN }}
      - run: npm run build
        env:
          APPLESHOP_PREVIEW_URL: https://adriaaante.github.io/appleshop/
      - name: Сохранить посты и историю цен
        run: |
          git config user.name 'appleshop-bot'
          git config user.email 'appleshop-bot@users.noreply.github.com'
          git add data/
          git diff --cached --quiet || { git commit -m "Каталог: обновление цен $(date -u +%Y-%m-%dT%H:%MZ)" && git push; }
      # Готовый сайт — в ветку gh-pages; Pages выкладывает её сам (Settings → Pages → Deploy from a branch → gh-pages).
      - name: Выложить в gh-pages
        if: github.ref_name == 'main' || github.event_name == 'schedule'
        run: |
          touch dist/.nojekyll
          cd dist
          git init -q -b gh-pages
          git add -A
          git -c user.name=appleshop-bot -c user.email=appleshop-bot@users.noreply.github.com commit -q -m "Сайт: сборка ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
